<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#12161c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TCG Manager" />
    <title>TCG Manager Simulator</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      /* The PAGE must never scroll. The webview runs under the status bar, so
         a scrolling body slides the safe-area padding out from under itself and
         content collides with the clock — which is exactly what happens when
         the keyboard opens and shrinks the viewport. Only inner panes scroll. */
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: oklch(0.20 0.012 250);
        overscroll-behavior: none;
      }
      #root {
        height: 100%; display: flex; flex-direction: column; overflow: hidden;
        padding-top: env(safe-area-inset-top, 0px);
      }
      * { -webkit-tap-highlight-color: transparent; }
      button { -webkit-appearance: none; appearance: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
