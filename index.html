<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: required for env(safe-area-inset-*) to report real values instead of
         0 — the iOS shell (see ios/Sources/Shell.swift) runs the web view edge to edge, so this is
         what lets the CSS clear the Dynamic Island and home indicator on its own. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ff3355'/%3E%3Crect x='9' y='6' width='14' height='20' rx='2' fill='%233b82f6'/%3E%3C/svg%3E"
    />
    <title>TCG Manager Simulator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
